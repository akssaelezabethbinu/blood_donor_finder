<!DOCTYPE html>
<html>

<head>

<title>Emergency Blood Requests</title>


<style>

body{

    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;

}


.container{

    width:500px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;

}


h1{

    color:red;

}


.card{

    background:#ffe6e6;
    padding:20px;
    margin:20px;
    border-radius:10px;
    text-align:left;

}


button{

    background:red;
    color:white;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;

}


a{

    text-decoration:none;

}


</style>


</head>


<body>


<div class="container">


<h1>🚨 Emergency Blood Requests</h1>



{% if requests %}


{% for req in requests %}



<div class="card">


<h3>
👤 Patient Name: {{req[1]}}
</h3>


<p>
🩸 Blood Group: {{req[2]}}
</p>


<p>
🏥 Hospital: {{req[3]}}
</p>


<p>
📞 Phone: {{req[4]}}
</p>


<a href="tel:{{req[4]}}">

<button>
Contact
</button>

</a>


</div>



{% endfor %}



{% else %}


<h3>
No Emergency Requests Available
</h3>


{% endif %}



<a href="/">

<button>
Back to Home
</button>

</a>



</div>


</body>

</html>
