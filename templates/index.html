<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Blood Donor Finder</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="text-center">

        <h1 class="text-danger">🩸 Blood Donor Finder</h1>
        <p class="lead">Find blood donors quickly during emergencies.</p>

    </div>

    <div class="row mt-5">

        <div class="col-md-4 mb-3">

            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>📝 Register Donor</h4>
                    <a href="/register" class="btn btn-danger mt-3">Open</a>
                </div>
            </div>

        </div>

        <div class="col-md-4 mb-3">

            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>🔍 Find Donor</h4>
                    <a href="/search" class="btn btn-success mt-3">Open</a>
                </div>
            </div>

        </div>

        <div class="col-md-4 mb-3">

            <div class="card shadow">
                <div class="card-body text-center">
                    <h4>🚑 Emergency Request</h4>
                    <a href="/request" class="btn btn-warning mt-3">Open</a>
                </div>
            </div>

        </div>

    </div>

</div>
<div class="col-md-4 mb-3">
    <div class="card shadow">
        <div class="card-body text-center">
            <h4>🩸 Blood Compatibility</h4>
            <a href="/compatibility" class="btn btn-primary mt-3">Open</a>
        </div>
    </div>
</div>
</body>
</html>
